<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Raíz (castellano): ?lang= de enlaces antiguos o el idioma guardado ('tsb-locale', ver
      // src/i18n) llevan a /ca/ antes de pintar nada. El resto de rutas se respetan.
      ;(function () {
        if (location.pathname !== '/') return
        var url = new URL(location.href)
        var lang = url.searchParams.get('lang')
        url.searchParams.delete('lang')
        try {
          lang = lang || localStorage.getItem('tsb-locale')
        } catch (e) {}
        if (lang !== 'ca') return
        url.pathname = '/ca/'
        location.replace(url.href)
      })()
    </script>
